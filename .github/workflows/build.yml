# Builds the specification PDF with the containerized MDSA pipeline, exactly as an
# author does locally ('make pandoc check'): the repository's own Dockerfile and
# Makefile build the image, then the image builds and checks the PDF. No separate
# CI image or build script is involved.
#
# - Docker layers are cached between runs in the GitHub Actions cache. The Makefile
#   passes the latest mdsa-omg-core and mdsa-tools commits as build arguments, so
#   cached layers are reused until one of them, or the Dockerfile, changes.
# - The PDF is kept as the workflow artifact "specification-pdf".
# - Builds of 'main' are published as the release "latest", so the PDF has a stable
#   download URL: https://github.com/<owner>/<repo>/releases/latest/download/<file>.pdf

name: Build specification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # mdsa-omg-core with the Markdown pipeline fixes, until they are merged into
  # ObjectManagementGroup/mdsa-omg-core. Afterwards, remove these two lines and
  # the "Check out mdsa-omg-core" step; the image then uses the official core.
  CORE_REPOSITORY: falko/mdsa-omg-core
  CORE_REF: clause-autoinclude

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out specification
        uses: actions/checkout@v4

      - name: Check out mdsa-omg-core
        if: env.CORE_REPOSITORY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: .ci/mdsa-omg-core

      # 'docker build' (used by the Makefile) runs on BuildKit, which can store
      # layers in the GitHub Actions cache ...
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ... with the cache credentials of the runner exposed to the shell
      - name: Expose GitHub Actions cache to Docker
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and check PDF
        run: >-
          make pandoc check
          ${CORE_REPOSITORY:+core=.ci/mdsa-omg-core}
          docker_build_opts="--cache-from type=gha,scope=mdsa-pandoc --cache-to type=gha,scope=mdsa-pandoc,mode=max --load"

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specification-pdf
          path: "*.pdf"
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
    steps:
      - name: Download PDF
        uses: actions/download-artifact@v4
        with:
          name: specification-pdf

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest *.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build of main" \
            --notes "PDF built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC') by [this workflow run]($RUN_URL). Replaced by every build of main."
